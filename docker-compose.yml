version: '3.8'

services:
  app:
    build: .
    ports:
      - "11435:11435"
    environment:
      - NODE_ENV=production
    networks:
      - soc-network
    depends_on:  
      - ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11435/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - soc-network

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    networks:
      - soc-network
    volumes:
      - ollama_data:/root/.ollama

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./soc-triage-tester:/usr/share/nginx/html  # Updated path
    depends_on:
      - app
    networks:
      - soc-network

networks:
  soc-network:
    driver: bridge

volumes:
  ollama_data: